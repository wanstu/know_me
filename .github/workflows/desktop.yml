name: Native Desktop

on:
  push:
    branches:
      - master
      - "refactor/**"
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      updater_e2e:
        description: Run installed RC1 to RC2 updater E2E on an isolated Windows runner
        type: boolean
        required: false
        default: false

concurrency:
  group: native-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    uses: wanstu/wails-desktop-kit/.github/workflows/wails-desktop.yml@v0.11.0
    with:
      app-name: know-me-desktop
      desktop-dir: cmd/know-me-desktop
      desktopkit-cli-version: v0.11.0
      test-command: ""
      vet-command: ""
      build-command-windows: ./scripts/build-desktop.ps1
      build-command-linux: bash ./scripts/build-desktop.sh
      build-command-macos: bash ./scripts/build-desktop.sh
      linux-package-formats: raw,deb,tar.gz
      linux-package-name: know-me-desktop
      linux-package-description: Know Me desktop application
      linux-deb-depends: libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0
      linux-desktop-file: cmd/know-me-desktop/packaging/know-me-desktop.desktop
      linux-icon-file: cmd/know-me-desktop/build/appicon.png
      publish-release: false

  updater_e2e:
    name: Installed desktop RC1 to RC2 updater E2E
    if: github.event_name == 'workflow_dispatch' && inputs.updater_e2e
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Check, Download, SHA256, Install, Restart and data preservation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-desktop-updater-e2e.ps1
