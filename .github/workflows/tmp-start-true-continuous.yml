name: Temporary true continuous Start build

on:
  push:
    branches:
      - "feat/start-true-continuous-scroll"

permissions:
  contents: write

jobs:
  verify-and-build:
    if: "!contains(github.event.head_commit.message, 'build: refresh true continuous Start assets')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm run native:web:build
      - run: go test ./...
      - run: go vet ./...
      - name: Commit generated Native Web assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/webassets/static
          if git diff --cached --quiet; then
            echo "Native Web assets already up to date"
            exit 0
          fi
          git commit -m "build: refresh true continuous Start assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
