name: Temp Publish RC11

on:
  push:
    branches:
      - "fix/start-continuous-gap-layout"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG_NAME: v0.1.17-rc.11
      TARGET_SHA: dfec484c71dea2aa5f259630c19ef6a265693811
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --tags
          git cat-file -e "${TARGET_SHA}^{commit}"
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            actual="$(git rev-list -n1 "${TAG_NAME}")"
            test "${actual}" = "${TARGET_SHA}" || {
              echo "Existing tag ${TAG_NAME} points to ${actual}, expected ${TARGET_SHA}" >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG_NAME}" "${TARGET_SHA}" -m "Know Me ${TAG_NAME}: continuous Start gap fix"
            git push origin "refs/tags/${TAG_NAME}"
          fi
      - name: Dispatch official Release workflow from tag
        shell: bash
        run: gh workflow run release.yml --ref "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}"
