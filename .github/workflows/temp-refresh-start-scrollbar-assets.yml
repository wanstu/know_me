name: Temp Refresh Start Scrollbar Assets

on:
  push:
    branches:
      - "fix/start-loop-hide-scrollbar"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run native:web:build
      - name: Commit generated Native Web assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- internal/webassets/static && [ -z "$(git status --porcelain -- internal/webassets/static)" ]; then
            echo "Native Web assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A internal/webassets/static
          git commit -m "chore: refresh native web assets"
          git push origin HEAD:fix/start-loop-hide-scrollbar
